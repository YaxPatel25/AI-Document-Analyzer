spring:
  application:
    name: DocumentAnalyzer
  datasource:
    url: jdbc:postgresql://localhost:5433/docai
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active: local 