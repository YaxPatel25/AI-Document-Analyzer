spring:
  application:
    name: DocumentAnalyzer

  datasource:
    url: jdbc:postgresql://docai-postgres:5432/docai
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

groq:
  api-key: ${GROQ_API_KEY}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}