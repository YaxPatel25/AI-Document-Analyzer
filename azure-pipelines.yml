trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

steps:

  # =========================
  # Backend - Java / Spring Boot
  # =========================

  - task: JavaToolInstaller@0
    displayName: 'Set up Java 21'
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - script: |
      java -version
      mvn -version
    workingDirectory: backend-java
    displayName: 'Verify Java and Maven'

  - script: |
      mvn clean test
    workingDirectory: backend-java
    displayName: 'Run Backend Tests'

  - script: |
      mvn package -DskipTests
    workingDirectory: backend-java
    displayName: 'Package Spring Boot Backend'

  - task: PublishTestResults@2
    displayName: 'Publish JUnit Test Results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'backend-java/target/surefire-reports/TEST-*.xml'
      failTaskOnFailedTests: true
      testRunTitle: 'Backend JUnit Tests'


  # =========================
  # Frontend - React / Vite
  # =========================

  - task: UseNode@1
    displayName: 'Set up Node.js'
    inputs:
      version: '24.x'

  - script: |
      node --version
      npm --version
    workingDirectory: frontend-react
    displayName: 'Verify Node.js'

  - script: |
      npm install -g npm@10.8.1
      npm --version
    displayName: 'Set up npm 10.8.1'

  - script: |
      npm ci
    workingDirectory: frontend-react
    displayName: 'Install React dependencies'

  - script: |
      npm run build
    workingDirectory: frontend-react
    displayName: 'Build React application'


  # =========================
  # Push Docker Images to ACR
  # =========================

  - task: Docker@2
    displayName: 'Push Backend Image to ACR'
    inputs:
      command: 'buildAndPush'
      containerRegistry: 'docai-acr-connection'
      repository: 'document-analyzer-backend'
      dockerfile: 'backend-java/Dockerfile'
      buildContext: 'backend-java'
      tags: |
        $(Build.BuildId)
        latest

  - task: Docker@2
    displayName: 'Push Frontend Image to ACR'
    inputs:
      command: 'buildAndPush'
      containerRegistry: 'docai-acr-connection'
      repository: 'document-analyzer-frontend'
      dockerfile: 'frontend-react/Dockerfile'
      buildContext: 'frontend-react'
      tags: |
        $(Build.BuildId)
        latest  